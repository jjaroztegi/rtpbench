name: Images

# The images rtpbench builds, on GHCR, where a host missing one pulls it before building it:
# rtpbench under its content hash, the carrier's and the bundled targets' under their pinned
# tags. A tag already there stays as pushed, so change what an image builds with its tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  push:
    name: Push
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          export RTPBENCH_REGISTRY="ghcr.io/${OWNER,,}"
          tag=$(uv run --locked python -c 'from rtpbench.bench import _image_tag; print(_image_tag())')
          export RTPBENCH_IMAGE="$RTPBENCH_REGISTRY/$tag"
          # what the compose files need set to be read; nothing runs here
          export RTPBENCH_OUT=/tmp RTPBENCH_CARRIER_NEXT=- OPENAI_API_KEY=- AZURE_OPENAI_ENDPOINT=- \
            AZURE_OPENAI_API_KEY=-
          for target in "" targets/*/; do
            files=(-f compose.yaml -f carrier/compose.yaml)
            [ -n "$target" ] && files+=(-f "${target}compose.yaml")
            config=$(docker compose "${files[@]}" config --format json)
            mapfile -t built < <(jq -r '.services | to_entries[] | select(.value.build) |
              "\(.key) \(.value.image)"' <<< "$config")
            for line in "${built[@]}"; do
              read -r service image <<< "$line"
              if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
                echo "$image: pushed already"
              else
                docker compose "${files[@]}" build --push "$service"
              fi
            done
          done
