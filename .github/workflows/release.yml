name: Release

# The sdist and wheel to PyPI on a v* tag, by trusted publishing (no token): the wheel is first
# installed alone outside the checkout and run. Pull requests run the build and that check only.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [ "$TAG" = "v$(uv version --short)" ] || { echo "::error::$TAG is not pyproject.toml's version"; exit 1; }

      - run: uv build

      # what `uvx rtpbench` gets: the stacks' files resolve from the package, and a call runs
      - name: Smoke test
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          DIST: ${{ github.workspace }}/dist
        run: |
          uv venv -q --python 3.14 smoke && uv pip install -q --python smoke "$DIST"/*.whl
          smoke/bin/rtpbench --version
          root=$(smoke/bin/python -I -c 'from rtpbench import PACKAGE, ROOT; assert ROOT == PACKAGE; print(ROOT)')
          for target in "$root"/targets/*/; do
            config=$(RTPBENCH_IMAGE=x RTPBENCH_REGISTRY=x RTPBENCH_OUT=/tmp RTPBENCH_CARRIER_NEXT=x \
              OPENAI_API_KEY=x AZURE_OPENAI_ENDPOINT=x AZURE_OPENAI_API_KEY=x \
              docker compose -f "$root/compose.yaml" -f "$root/carrier/compose.yaml" \
              -f "${target}compose.yaml" -f "$root/mock/compose.yaml" config --format json)
            # every file a service mounts and every local build context, in the package
            jq -r '.services[] | ((.volumes // [])[] | select(.type == "bind") | .source),
              (.build.context // empty | select(startswith("/")))' <<< "$config" |
              while read -r path; do [ -e "$path" ] || { echo "::error::missing $path"; exit 1; }; done
          done
          smoke/bin/rtpbench calibrate --profiles clean --turns 5 --out calibrate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - run: uv publish
