name: Calibrate

on:
  workflow_dispatch:
    inputs:
      profiles:
        default: clean,delay,jitter,loss,mobile
      turns:
        default: "10"

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv run rtpbench calibrate --profiles "$PROFILES" --turns "$TURNS" --out results/ci
        env:
          PROFILES: ${{ inputs.profiles }}
          TURNS: ${{ inputs.turns }}

      - run: cat results/ci/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: calibration
          path: results/ci
