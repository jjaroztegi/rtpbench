# caller | router | agent (and operator). netem runs only on the router, so both captures sit at
# true endpoints.
# Driven by `rtpbench calibrate`, which sets RTPBENCH_IMAGE, RTPBENCH_OUT and a unique project name.
x-node: &node
  image: ${RTPBENCH_IMAGE:?}
  cap_add: [NET_ADMIN]
  init: true

services:
  router:
    <<: *node
    build: .
    sysctls:
      net.ipv4.ip_forward: 1
    networks: [callnet, agentnet]
    command: sleep infinity

  agent:
    <<: *node
    depends_on: [router]
    networks: [agentnet]
    volumes: ["${RTPBENCH_OUT:?}:/out"]
    command: sh -c 'ip route replace default via $$(getent hosts router | cut -d" " -f1) && exec sleep infinity'

  # the transfer target a transferee calls (agent.OPERATOR), on the agent's side of the router
  operator:
    <<: *node
    depends_on: [router]
    networks: [agentnet]
    command: sh -c 'ip route replace default via $$(getent hosts router | cut -d" " -f1) && exec python -m rtpbench operator'
    healthcheck:
      test: test -e /tmp/ready
      interval: 1s
      retries: 30

  caller:
    <<: *node
    depends_on: [router]
    networks: [callnet]
    volumes: ["${RTPBENCH_OUT:?}:/out"]
    command: sh -c 'ip route replace default via $$(getent hosts router | cut -d" " -f1) && exec sleep infinity'

# The router forwards between these networks. Docker's default gateway mode drops packets
# addressed to a container that arrive from another bridge; where bridged traffic goes through
# iptables (br_netfilter) that includes every routed packet, so these networks opt out of it.
networks:
  callnet:
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected }
  agentnet:
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected }
