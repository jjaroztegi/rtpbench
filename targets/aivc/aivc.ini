# AI Voice Connector CE settings for rtpbench: the openai flavor only, as upstream's example sets
# it (voice, instructions, welcome message), plus a transfer target so the refer cases can run:
# the operator (rtpbench's transfer target, compose.yaml).
# The key and URL come from the environment (OPENAI_API_KEY, OPENAI_URL).
[opensips]
ip = 127.0.0.1
port = 8080

[engine]
event_ip = 127.0.0.1

[openai]
voice = alloy
instructions = You are a helpful assistant.
welcome_message = Hello! How can I help you?
transfer_to = sip:operator@operator

[deepgram]
disabled = true

[deepgram_native]
disabled = true

[azure]
disabled = true
