; Asterisk for rtpbench: plain SIP over UDP and TCP, any caller, G.711 only
[udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[anonymous]
type=endpoint
context=from-caller
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733
