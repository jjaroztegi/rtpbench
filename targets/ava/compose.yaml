# Asterisk + AVA (Asterisk AI Voice Agent) as a target, merged over ../../compose.yaml. AVA is an
# ARI app for an existing Asterisk; its compose runs the engine on the host's network next to
# it. Here Asterisk and the engine share the network namespace of `target` (agentnet, plus
# egress to the AI engine), and the engine reaches ARI and the call audio (AudioSocket or
# ExternalMedia RTP, AVA_TRANSPORT) on 127.0.0.1.
# rtpbench routes the caller via the router, so SIP and RTP cross netem. Needs OPENAI_API_KEY
# (and OPENAI_BASE_URL for another Realtime endpoint). Paths are relative to the repository
# root, the first compose file's directory.
services:
  target:
    image: ${RTPBENCH_IMAGE:?}
    cap_add: [NET_ADMIN]
    init: true
    depends_on: [router]
    networks: [agentnet, egress]
    command: sleep infinity

  asterisk:
    build:
      context: ./targets/ava
      # andrius/asterisk without the AudioSocket modules (menuselect leaves them out): built
      # from the same source and ABI options (OPTIONAL_API), and added
      dockerfile_inline: |
        FROM debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5 AS modules
        # the Debian snapshot this base image was built from, so every package version is fixed
        RUN sed -i -e 's|^URIs: http://deb.debian.org/debian$$|URIs: http://snapshot.debian.org/archive/debian/20261005T000000Z|' \
            -e 's|^URIs: http://deb.debian.org/debian-security$$|URIs: http://snapshot.debian.org/archive/debian-security/20261005T000000Z|' \
            /etc/apt/sources.list.d/debian.sources \
            && apt-get -o Acquire::Check-Valid-Until=false update \
            && apt-get install -y --no-install-recommends ca-certificates \
            build-essential curl libedit-dev libjansson-dev libncurses-dev libsqlite3-dev \
            libssl-dev libxml2-dev uuid-dev pkg-config libcurl4-openssl-dev libsrtp2-dev
        WORKDIR /usr/src/asterisk
        RUN curl -fsSL -o /tmp/a.tar.gz https://downloads.asterisk.org/pub/telephony/certified-asterisk/releases/asterisk-certified-22.8-cert4.tar.gz \
            && echo "a41a7007d420119255017bbf15759a4204fb45915b1ce5f0dc7622ecaf498c34  /tmp/a.tar.gz" | sha256sum -c - \
            && tar --strip-components=1 -xzf /tmp/a.tar.gz && rm /tmp/a.tar.gz
        RUN ./configure --with-ssl=ssl --with-crypto --without-pjproject-bundled \
            --without-pjproject > /dev/null && make menuselect.makeopts > /dev/null \
            && menuselect/menuselect --disable BUILD_NATIVE --enable BETTER_BACKTRACES \
            --enable res_audiosocket --enable chan_audiosocket --enable app_audiosocket \
            menuselect.makeopts
        RUN make -j"$$(nproc)" res channels apps > /dev/null \
            && grep -q '"OPTIONAL_API"' include/asterisk/buildopts.h

        FROM andrius/asterisk:22.8-cert4_debian-trixie@sha256:f3bd01300f0c36c8a7ea5bd9472c4b906d0f85410c3ea429166a0fedac6ad3ee
        COPY --from=modules /usr/src/asterisk/res/res_audiosocket.so \
            /usr/src/asterisk/channels/chan_audiosocket.so \
            /usr/src/asterisk/apps/app_audiosocket.so /usr/lib/asterisk/modules/
    image: rtpbench-ava-asterisk:22.8-cert4
    network_mode: service:target
    depends_on: [target]
    volumes:
      - ./targets/ava/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./targets/ava/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./targets/ava/ari.conf:/etc/asterisk/ari.conf:ro
      - ./targets/ava/http.conf:/etc/asterisk/http.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          asterisk -rx 'ari show status' | grep -q Enabled &&
          asterisk -rx 'module show like chan_audiosocket' | grep -q Running
      interval: 1s
      retries: 30

  engine:
    build:
      context: https://github.com/hkjarral/AVA-AI-Voice-Agent-for-Asterisk.git#ba52df92bc1cad2c1f277034e1423b80c8f50be4
      # upstream's Dockerfile, with the base image and every installed package pinned
      # (upstream pins some of its direct requirements)
      additional_contexts: { pins: ./targets/ava }
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89 AS builder
        WORKDIR /usr/src/app
        RUN apt-get -o Acquire::Retries=5 update && apt-get install -y --no-install-recommends \
            build-essential && rm -rf /var/lib/apt/lists/*
        RUN python -m venv /opt/venv
        ENV PATH="/opt/venv/bin:$$PATH"
        COPY requirements.txt .
        COPY --from=pins constraints.txt /tmp/constraints.txt
        RUN pip install --no-cache-dir -r requirements.txt -c /tmp/constraints.txt

        FROM python:3.11-slim-bookworm@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        RUN apt-get -o Acquire::Retries=5 update \
            && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        RUN groupadd -g 995 asterisk || true && useradd --create-home appuser \
            && usermod -aG 995 appuser
        COPY --from=builder /opt/venv /opt/venv
        COPY --chown=appuser:appuser src/ ./src
        COPY --chown=appuser:appuser config/ ./config
        COPY --chown=appuser:appuser main.py ./
        RUN mkdir -p /app/logs /app/data && chown appuser:appuser /app/logs /app/data
        ENV PATH="/opt/venv/bin:$$PATH"
        USER appuser
        CMD ["python", "main.py"]
    image: rtpbench-ava:ba52df9
    network_mode: service:target
    depends_on:
      asterisk: { condition: service_healthy }
    volumes: ["./targets/ava/ai-agent.yaml:/app/config/ai-agent.yaml:ro"]
    environment:
      ASTERISK_HOST: 127.0.0.1
      ASTERISK_ARI_PORT: "8088"
      ASTERISK_ARI_USERNAME: asterisk
      ASTERISK_ARI_PASSWORD: asterisk
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-wss://api.openai.com/v1/realtime}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-realtime-2.1}
      # the golden config's egress pacer: on as shipped, false to measure what it costs
      AVA_EGRESS_PACER: ${AVA_EGRESS_PACER:-true}
      # how Asterisk hands AVA the call audio: AudioSocket (TCP) as shipped, or externalmedia (RTP)
      AVA_TRANSPORT: ${AVA_TRANSPORT:-audiosocket}
      LOG_LEVEL: debug
    # ready once the engine serves its health endpoint
    healthcheck:
      test: python -c 'import urllib.request as u; u.urlopen("http://127.0.0.1:15000/health")'
      interval: 1s
      retries: 60

networks:
  egress:
