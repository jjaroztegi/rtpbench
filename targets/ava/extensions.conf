; the caller dials `agent`; AVA's ARI app answers and runs the call
[from-caller]
exten => agent,1,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

; AVA's blind_transfer continues the answered call here: Transfer() sends a REFER, waits for
; its outcome and leaves the call up, so hang up after it either way (AVA's session has ended)
[transfer]
exten => operator,1,Transfer(PJSIP/sip:operator@operator)
 same => n,Hangup()
