# `rtpbench target ava --source DIR`: AVA built from the checkout DIR with upstream's own
# Dockerfile, as the project builds it, in place of the pinned commit. Merged over compose.yaml;
# the tag follows the checkout's commit and, as every build's, a hash of the build.
services:
  engine:
    build: !override
      context: ${RTPBENCH_SOURCE:?}
    image: ${RTPBENCH_REGISTRY:?}/rtpbench-ava:${RTPBENCH_SOURCE_COMMIT:?}${RTPBENCH_BUILD_ENGINE:-}
