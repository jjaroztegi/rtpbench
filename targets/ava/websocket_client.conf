; AVA_TRANSPORT=websocket: for each call, AVA asks ARI for a WebSocket media channel on this
; client and Asterisk connects to the engine's listener, on loopback as they share a network
; namespace (stanza as in AVA's docs/WebSocket-Transport.md; the password is the engine's
; ASTERISK_MEDIA_WS_PASSWORD, a test value like ARI's)
[aava_media]
type = websocket_client
uri = ws://127.0.0.1:8787/media
protocols = media
username = aava_media
password = asterisk
connection_type = per_call_config
connection_timeout = 500
reconnect_interval = 500
reconnect_attempts = 5
tls_enabled = no
