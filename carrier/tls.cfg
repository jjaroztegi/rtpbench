# rtpbench carrier with SIP over TLS on the caller's leg (5061), as a trunk takes it: the
# certificate is the stack's test one; nothing checks the caller's. Everything else is
# opensips.cfg, included below; the agent's leg stays on UDP.

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

socket=tls:*:5061

loadmodule "tls_openssl.so"
loadmodule "tls_mgm.so"
loadmodule "proto_tls.so"

modparam("tls_mgm", "server_domain", "carrier")
modparam("tls_mgm", "certificate", "[carrier]/tls/server.crt")
modparam("tls_mgm", "private_key", "[carrier]/tls/server.key")
modparam("tls_mgm", "ca_list", "[carrier]/tls/stack-ca.pem")
modparam("tls_mgm", "tls_method", "[carrier]TLSv1_2-")
modparam("tls_mgm", "verify_cert", "[carrier]0")
modparam("tls_mgm", "require_cert", "[carrier]0")
# should a request to the caller need a connection of its own (the caller's is reused)
modparam("tls_mgm", "client_domain", "caller")
modparam("tls_mgm", "match_ip_address", "[caller]*")
modparam("tls_mgm", "verify_cert", "[caller]0")

include_file "/etc/opensips/opensips.cfg"
