# rtpbench carrier: an SBC in front of the agent, as trunks put one. A stateful proxy that keeps
# a dialog per call, hides the topology (the agent sees the carrier as the far end: its Via,
# Contact and Call-ID side only) and anchors the media of both legs in rtpengine. Every request
# goes to the host in CARRIER_NEXT, with the caller's Request-URI user, except calls to the user
# `operator` (a transfer's target), which go to the host of that name.
#
# A call can ask for one mutation in an X-Mutation header (removed here), applied to what goes
# to the agent:
#   compact-headers  From, To, Call-ID, Content-Type in compact form (RFC 3261 7.3.3)
#   sdp-ssrc         the offer carries `a=ssrc:<id>` without an attribute (AIVC CE #27)
#   late-offer       the INVITE carries no SDP: the agent offers in its 2xx, the ACK answers
#                    (RFC 3261 13.2.1); the caller's leg stays early offer
#   ptime-30         rtpengine repacketises the caller's audio to 30 ms (a=ptime:30)

log_level=2
xlog_level=2
stderror_enabled=yes
syslog_enabled=no

socket=udp:*:5060

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "proto_udp.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"
loadmodule "signaling.so"
loadmodule "cfgutils.so"
loadmodule "mi_fifo.so"
loadmodule "dialog.so"
loadmodule "topology_hiding.so"
loadmodule "rtpengine.so"

modparam("mi_fifo", "fifo_name", "/tmp/opensips_fifo")
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")

route {
	if (!mf_process_maxfwd_header(10)) {
		send_reply(483, "Too Many Hops");
		exit;
	}

	if (has_totag()) {
		if (topology_hiding_match()) {
			if ($DLG_dir == "downstream")
				route(mutate);
			if (is_method("INVITE") && !has_body("application/sdp"))
				$dlg_val(reoffer) = "1";  # a re-INVITE without SDP: the 2xx offers
			if (is_method("BYE")) {
				rtpengine_delete();
			} else if (is_method("ACK") && $dlg_val(offer) != NULL) {
				# late offer: the caller's offer, as rtpengine gave it, answers the agent's
				add_body_part($dlg_val(offer), "application/sdp");
				$dlg_val(offer) = NULL;
			} else if (is_method("ACK") && has_body("application/sdp")) {
				rtpengine_answer("replace-origin");
				$dlg_val(reoffer) = NULL;
			} else {
				route(media_offer);
			}
			t_on_reply("media_answer");
			t_relay();
		} else if (is_method("ACK") && t_check_trans()) {
			t_relay();
		} else if (!is_method("ACK")) {
			send_reply(481, "Call/Transaction Does Not Exist");
		}
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans())
			t_relay();
		exit;
	}

	t_check_trans();

	if (!is_method("INVITE")) {
		send_reply(405, "Method Not Allowed");
		exit;
	}

	create_dialog();
	if ($hdr(X-Mutation) != NULL) {
		$dlg_val(mutation) = $hdr(X-Mutation);
		remove_hf("X-Mutation");
		xlog("L_NOTICE", "carrier: $ci gets $dlg_val(mutation)\n");
	}
	$rd = $env(CARRIER_NEXT);
	if ($rU == "operator")  # a transferee calling the transfer target
		$rd = "operator";
	$rp = 5060;
	topology_hiding("C");
	route(mutate);
	route(media_offer);
	t_on_reply("media_answer");
	t_on_failure("media_end");
	t_relay();
}

route[mutate] {
	if ($dlg_val(mutation) == "compact-headers") {
		subst('/^From:/f:/');
		subst('/^To:/t:/');
		subst('/^Call-ID:/i:/');
		subst('/^Content-Type:/c:/');
	}
}

route[media_offer] {
	if (!has_body("application/sdp"))
		return;
	$var(flags) = "replace-origin";
	if ($dlg_val(mutation) == "ptime-30")
		$var(flags) = $var(flags) + " ptime=30";
	if ($dlg_val(mutation) == "sdp-ssrc")
		$var(flags) = $var(flags) + " sdp-attr-add-audio-ssrc:2330119309";
	if ($dlg_val(mutation) == "late-offer" && !has_totag()) {
		rtpengine_offer($var(flags), , $var(sdp));
		$dlg_val(offer) = $var(sdp);
		remove_body_part();
	} else {
		rtpengine_offer($var(flags));
	}
}

onreply_route[media_answer] {
	if (!has_body("application/sdp"))
		return;
	if ($dlg_val(reoffer) == "1" && is_method("INVITE"))
		rtpengine_offer("replace-origin");
	else
		rtpengine_answer("replace-origin");
}

failure_route[media_end] {
	rtpengine_delete();
}
