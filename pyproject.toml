[project]
name = "rtpbench"
version = "0.4.0"
description = "Wire-level latency and conformance tests for voice agents over SIP/RTP"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Juanjo Aroztegi", email = "juanjo@aroztegi.com" }]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50",
    "rich>=15",
]

[project.optional-dependencies]
vad = ["onnxruntime>=1.31", "webrtcvad-wheels>=2.0.14"]

[project.scripts]
rtpbench = "rtpbench.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9",
    "rtpbench[vad]",  # the detector tests and its type checks need it
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
    "src", "tests", "compose.yaml", "Dockerfile", ".dockerignore", "corpus", "uri", "mock",
    "carrier", "targets",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rtpbench"]

# the stacks' files: a checkout keeps them at its root, an installed rtpbench in its package
[tool.hatch.build.targets.wheel.force-include]
"compose.yaml" = "rtpbench/compose.yaml"
"Dockerfile" = "rtpbench/Dockerfile"
".dockerignore" = "rtpbench/.dockerignore"
"corpus" = "rtpbench/corpus"
"uri" = "rtpbench/uri"
"mock" = "rtpbench/mock"
"carrier" = "rtpbench/carrier"
"targets" = "rtpbench/targets"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "PT", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "results"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "webrtcvad"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
