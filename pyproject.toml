[project]
name = "rtpbench"
version = "0.0.0"
description = "Wire-level latency and conformance tests for voice agents over SIP/RTP"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Juanjo Aroztegi", email = "juanjo@aroztegi.com" }]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["mypy>=2.4", "ruff>=0.17"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "PT", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
